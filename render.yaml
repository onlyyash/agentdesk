# One-click deploy on Render: New > Blueprint > pick this repo, then set GOOGLE_API_KEY.
services:
  - type: web
    name: agentdesk
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: agentdesk-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: agentdesk-redis, property: connectionString }

  - type: keyvalue
    name: agentdesk-redis
    plan: free
    ipAllowList: []

databases:
  - name: agentdesk-db
    plan: free
